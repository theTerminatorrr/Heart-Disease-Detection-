<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heart Disease Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <a class="gh" href="https://github.com/theTerminatorrr/Heart-Disease-Detection" target="_blank" rel="noopener">View source Code on
    GitHub</a>

  <main>
    <header>
      <h1>Heart Disease Predictor</h1>
      <p>Enter 13 clinical values. A logistic regression model estimates the likelihood of heart disease.</p>
    </header>

    <form id="form" class="glass" novalidate>
      <div class="grid" id="fields"></div>
      <div class="actions">
        <button type="submit" class="btn primary">Predict</button>
        <button type="button" id="example" class="btn">Fill example</button>
        <button type="reset" class="btn">Clear</button>
      </div>
    </form>

    <div id="overlay" hidden>
      <section id="result" class="glass" role="dialog" aria-modal="true" aria-labelledby="verdict">
        <button type="button" id="close" class="close" aria-label="Close result">&times;</button>
        <h2 id="verdict"></h2>
        <div class="bar"><span id="barfill"></span></div>
        <p id="prob"></p>
      </section>
    </div>

    <p class="note">Educational project only. Not a medical diagnosis. Ask a doctor about your heart health.</p>
  </main>
  <script src="model.js"></script>
  <script src="script.js"></script>
</body>

</html>
